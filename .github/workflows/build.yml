# .github/workflows/build-lsp-macos.yml
# ----------------------------------------------------------------------------
# Builds LSP Plugins 1.2.35 for Intel macOS (x86_64) on GitHub's free Intel
# macOS runner. No Mac required - this runs in GitHub's CI.
#
# USAGE:
#   1. Create a new public GitHub repository (private repos cost CI minutes)
#   2. Save this file as `.github/workflows/build-lsp-macos.yml` in the repo
#   3. Push to GitHub
#   4. Go to Actions tab → "Build LSP Plugins for macOS" → "Run workflow"
#   5. When the build finishes (about 5-10 minutes), download the artifacts
#      from the run summary page (scroll to bottom, click each artifact)
# ----------------------------------------------------------------------------
name: Build LSP Plugins for macOS

on:
  workflow_dispatch: {}   # manual trigger from the Actions tab
  push:
    branches: [ main ]

jobs:
  build-macos-intel:
    runs-on: macos-15-intel      # Intel x86_64 macOS runner (free for public repos)
    steps:
      - name: Checkout workflow
        uses: actions/checkout@v4

      - name: Install Homebrew dependencies
        run: |
          brew update
          brew install \
            cairo \
            freetype \
            fontconfig \
            pkg-config \
            make \
            php \
            jack

      - name: Download LSP source
        run: |
          curl -L -o lsp-plugins.zip \
            https://github.com/lsp-plugins/lsp-plugins/archive/refs/tags/1.2.35.zip
          unzip -q lsp-plugins.zip

      - name: Configure
        working-directory: lsp-plugins-1.2.35
        run: |
          gmake clean
          gmake config FEATURES="clap doc ladspa lv2 ui vst2 vst3"

      - name: Fetch subprojects
        working-directory: lsp-plugins-1.2.35
        run: gmake fetch

      - name: Build
        working-directory: lsp-plugins-1.2.35
        run: gmake -j$(sysctl -n hw.ncpu)

      - name: Install to staging directory
        working-directory: lsp-plugins-1.2.35
        run: |
          mkdir -p "$GITHUB_WORKSPACE/install"
          gmake install DESTDIR="$GITHUB_WORKSPACE/install"

      - name: Package archives
        run: |
          cd "$GITHUB_WORKSPACE/install/usr/local/lib"
          zip -qr "$GITHUB_WORKSPACE/lsp-plugins-vst2-1.2.35-macos-x86_64.zip" vst
          zip -qr "$GITHUB_WORKSPACE/lsp-plugins-vst3-1.2.35-macos-x86_64.zip" vst3
          zip -qr "$GITHUB_WORKSPACE/lsp-plugins-clap-1.2.35-macos-x86_64.zip" clap
          zip -qr "$GITHUB_WORKSPACE/lsp-plugins-ladspa-1.2.35-macos-x86_64.zip" ladspa
          zip -qr "$GITHUB_WORKSPACE/lsp-plugins-lv2-1.2.35-macos-x86_64.zip" lv2
          cd "$GITHUB_WORKSPACE/install/usr/local/share"
          zip -qr "$GITHUB_WORKSPACE/lsp-plugins-doc-1.2.35-html.zip" doc/lsp-plugins

      - name: Upload VST2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: lsp-plugins-vst2-1.2.35-macos-x86_64
          path: lsp-plugins-vst2-1.2.35-macos-x86_64.zip

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: lsp-plugins-vst3-1.2.35-macos-x86_64
          path: lsp-plugins-vst3-1.2.35-macos-x86_64.zip

      - name: Upload CLAP artifact
        uses: actions/upload-artifact@v4
        with:
          name: lsp-plugins-clap-1.2.35-macos-x86_64
          path: lsp-plugins-clap-1.2.35-macos-x86_64.zip

      - name: Upload LADSPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: lsp-plugins-ladspa-1.2.35-macos-x86_64
          path: lsp-plugins-ladspa-1.2.35-macos-x86_64.zip

      - name: Upload LV2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: lsp-plugins-lv2-1.2.35-macos-x86_64
          path: lsp-plugins-lv2-1.2.35-macos-x86_64.zip

      - name: Upload HTML documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: lsp-plugins-doc-1.2.35-html
          path: lsp-plugins-doc-1.2.35-html.zip
